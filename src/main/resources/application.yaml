spring:
  application:
    name: levelup-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/levelup_db
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
  jackson:
    deserialization:
      accept-float-as-int: false

security:
  jwt:
    secret: ${JWT_SECRET}
    duracion-segundos: 3600
